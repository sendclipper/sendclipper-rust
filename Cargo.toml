[package]
name = "sendclipper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Official Rust SDK for the SendClipper email API: send mail, manage domains, templates, sandboxes, webhooks, contacts and suppressions."
license = "MIT"
authors = ["SendClipper <support@sendclipper.com>"]
homepage = "https://sendclipper.com/docs#sdk-rust"
documentation = "https://docs.rs/sendclipper"
repository = "https://github.com/sendclipper/sendclipper-rust"
readme = "README.md"
keywords = ["email", "sendclipper", "transactional", "webhooks", "sdk"]
categories = ["api-bindings", "email", "web-programming::http-client"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
default = ["rustls-tls"]
# TLS through rustls (no system OpenSSL needed).
rustls-tls = ["reqwest/rustls-tls"]
# TLS through the platform's native library instead.
native-tls = ["reqwest/native-tls"]

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
http = "1"
httpdate = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc", "async-await-macro"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
